# Horizontal-scaling demo overlay. Usage:
#
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml \
#     up --build --scale app=3
#
# This starts 3 independent `app` containers (no shared memory) behind an
# nginx round-robin load balancer on :8080, all subscribed to the same
# Redis. Open http://localhost:8080/?room=demo in two browser tabs: the page
# and its WebSocket both go through the LB, the tabs are very likely on
# different containers, and edits still sync instantly.
services:
  app:
    # Drop the host port mapping from the base file: replicas can't all bind
    # the same host port, only the LB should be externally reachable.
    ports: !reset []

  lb:
    image: nginx:alpine
    volumes:
      - ./docker/nginx-lb.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    ports:
      - "${APP_HOST_PORT:-8080}:80"
