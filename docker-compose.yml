services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    environment:
      PORT: 1234
      REDIS_URL: redis://redis:6379
      MONGO_URL: mongodb://mongo:27017
    depends_on:
      - redis
      - mongo
    ports:
      - "1234:1234"

  client:
    build:
      context: ./client
      args:
        VITE_WS_URL: ws://localhost:1234
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  mongo-data:
