{{- if .Values.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "whiteboard.fullname" . }}-server
  labels: {{- include "whiteboard.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.pdb.minAvailable }}
  selector:
    matchLabels: {{- include "whiteboard.serverSelector" . | nindent 6 }}
{{- end }}
