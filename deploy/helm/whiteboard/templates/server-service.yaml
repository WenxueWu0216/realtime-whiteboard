apiVersion: v1
kind: Service
metadata:
  name: {{ include "whiteboard.fullname" . }}-server
  labels:
    {{- include "whiteboard.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with .Values.service.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector: {{- include "whiteboard.serverSelector" . | nindent 4 }}
  ports:
    - { name: http, port: {{ .Values.server.port }}, targetPort: http }
