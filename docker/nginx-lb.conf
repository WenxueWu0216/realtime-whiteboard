# Round-robin WebSocket load balancer for the horizontal-scaling demo.
#
# No ip_hash / sticky sessions here on purpose: two browser tabs in the same
# room can (and, round-robin, often will) land on *different* server
# containers. If that still works - both tabs seeing each other's edits -
# it's proof the Redis pub/sub relay (server/src/redis-adapter.ts) is doing
# its job, not just that "it happens to work because one process handled
# both connections."
upstream whiteboard_servers {
    server server:1234;
    # `docker compose --scale server=3` adds more containers on the same
    # service name; Docker's embedded DNS round-robins `server` across them,
    # so this single upstream entry already fans out to all replicas.
}

server {
    listen 80;

    location / {
        proxy_pass http://whiteboard_servers;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
